default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV["DB_POOL"] || 15 %>
  host: <%= ENV.fetch("POSTGRES_HOSTNAME", "localhost") %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "postgres") %>
development:
  <<: *default
  database: <%= ENV.fetch('DB_NAME', 'payment_service_development') %>
  